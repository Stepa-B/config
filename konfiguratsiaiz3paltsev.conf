AND,((PROTOCOL,UDP),(DST-PORT,443),(DOMAIN-SUFFIX,whatsapp.net)),REJECT
AND,((PROTOCOL,UDP),(DST-PORT,443),(IP-CIDR,157.240.0.0/16,no-resolve)),REJECT
AND,((PROTOCOL,UDP),(DST-PORT,443),(IP-CIDR,57.144.0.0/14,no-resolve)),REJECT
AND,((PROTOCOL,UDP),(DST-PORT,443),(IP-CIDR,31.13.24.0/21,no-resolve)),REJECT
AND,((PROTOCOL,UDP),(DST-PORT,443),(IP-CIDR,31.13.64.0/18,no-resolve)),REJECT
AND,((PROTOCOL,UDP),(DST-PORT,443),(IP-CIDR,179.60.192.0/22,no-resolve)),REJECT
AND,((PROTOCOL,UDP),(DST-PORT,443),(IP-CIDR,185.60.216.0/22,no-resolve)),REJECT

